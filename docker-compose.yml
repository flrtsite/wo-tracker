version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: workout_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build: 
      context: ./backend
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/workout_tracker
      JWT_SECRET: supersecret30days
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: always

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token eyJhIjoiMmEzZWMwZDUwZjlmOTE0N2Y1ZjE2NDRjMGUwYzhlMzYiLCJ0IjoiNWEyMWZjMDItYWIzMC00OGVjLTllNGYtMDdlYTZkYjE5MmU0IiwicyI6Ill6TXhaamhoWm1RdFpEaGlOaTAwWVdNNExXSmpZV1l0WldZek56VXhZbVV5TUdVMCJ9
    restart: always

volumes:
  pgdata:
